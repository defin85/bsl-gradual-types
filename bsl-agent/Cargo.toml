[package]
name = "bsl-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MCP server (stdio) providing semantic context for BSL projects"

[[bin]]
name = "bsl-agent"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
blake3 = { workspace = true }
bsl-analysis-v2 = { workspace = true }
bsl-backend = { workspace = true }
bsl-shared = { workspace = true }
clap = { workspace = true, features = ["derive"] }
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", branch = "main", features = ["client", "server", "macros", "transport-io", "transport-child-process"] }
schemars = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
walkdir = { workspace = true }
reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
tempfile = { workspace = true }
