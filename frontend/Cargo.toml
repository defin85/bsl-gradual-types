[package]
name = "bsl-frontend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Web frontend for BSL Gradual Type System"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
bsl-shared = { workspace = true, features = ["wasm"] }

# Leptos and web dependencies
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }

# WASM dependencies
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = { workspace = true }
gloo-net = { workspace = true }
web-sys = { workspace = true, features = ["Request", "RequestInit", "RequestMode", "Response", "Headers", "Window"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
urlencoding = { workspace = true }

# WASM random support - use workspace version
getrandom = { workspace = true }
gloo-timers = { version = "0.3.0", features = ["futures"] }
