[package]
name = "bsl-gradual-types"
version = "0.4.107"
edition = "2021"
authors = ["BSL Type System Team"]
description = "Gradual type system for 1C:Enterprise BSL with evolutionary architecture"
license = "MIT"
repository = "https://github.com/yourusername/bsl-gradual-types"
keywords = ["1c", "bsl", "type-system", "gradual-typing", "static-analysis"]
categories = ["development-tools", "parser-implementations"]

[workspace]
members = [
    "shared",
    "bsl-api-dtos",
    "line-index",
    "syntax",
    "semantic-diagnostics",
    "analysis-v2",
    "bsl-repository",
    "bsl-runtime",
    "bsl-types",
    "backend",
    "frontend",
    "cli",
    "type-visualization",  # Milestone 2.5: Унификация визуализации
    "mcp-debug-server",    # Milestone 4.4: MCP Debug Server
    "bsl-agent"            # MCP server for IDE/LLM agents
]
resolver = "2"

[workspace.package]
version = "0.4.107"
edition = "2021"
authors = ["BSL Type System Team"]
license = "MIT"

[workspace.dependencies]
# Core dependencies - shared across all crates
anyhow = "1.0"
thiserror = "1.0" 
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
bincode = "1.3"
indexmap = "2.0"
salsa = "0.25.2"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Additional backend dependencies
dashmap = "6.0"
arc-swap = "1.6"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }
tower-lsp = "0.20"
quick-xml = { version = "0.31", features = ["serialize", "overlapped-lists"] }
roxmltree = "0.19"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
nom = "7.1"
regex = "1.10"
urlencoding = "2.1"
url = "2.5"
indicatif = "0.17"
sha2 = "0.10"
cc = "1.0"
walkdir = "2.5"
notify = "6.1"
globset = "0.4"
lru = "0.12"
fs2 = "0.4"
blake3 = "1.5"
zstd = "0.13"

# Frontend dependencies
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = "0.8"
leptos_router = "0.8"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
gloo-net = "0.5"
web-sys = "0.3"

# Backend-specific dependencies
colored = "2.0"
tree-sitter = "0.25"
tree-sitter-bsl = { path = "third_party/tree-sitter-bsl" }
tempfile = "3.8"

# Дополнительные зависимости
chrono = { version = "0.4.41", features = ["serde"] }
rayon = "1.8"
scraper = "0.18"

# Development dependencies
criterion = "0.5"
pretty_assertions = "1.4"
insta = "1.34"

# Internal crates (defined here for workspace reference)
bsl-shared = { path = "shared", default-features = true }
bsl-api-dtos = { path = "bsl-api-dtos" }
bsl-line-index = { path = "line-index" }
bsl-syntax = { path = "syntax" }
bsl-diagnostics = { path = "semantic-diagnostics" }
bsl-analysis-v2 = { path = "analysis-v2" }
bsl-repository = { path = "bsl-repository" }
bsl-runtime = { path = "bsl-runtime" }
bsl-types = { path = "bsl-types" }
bsl-backend = { path = "backend" }
bsl-frontend = { path = "frontend" }
bsl-cli = { path = "cli" }
bsl-type-visualization = { path = "type-visualization" }

# Force single getrandom version with proper WASM features
getrandom = { version = "0.3", features = ["wasm_js"] }

# Dependencies for root crate (to enable re-exports for tests)
[dependencies]
bsl-backend = { path = "backend" }
bsl-shared = { path = "shared" }

# This is now a pure workspace project with lib support for tests
# === Build Tools ===
[build-dependencies]
cc = "1.0"

# === Development Tools ===
[dev-dependencies]
criterion = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
insta = { workspace = true }
tokio = { workspace = true }
bsl-backend = { path = "backend" }
bsl-shared = { path = "shared" }
bsl-analysis-v2 = { workspace = true }

# === Performance Profiles ===
[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3      # Optimize for speed (backend/CLI)
lto = true         # Link-time optimization
codegen-units = 1  # Better optimization
strip = true       # Strip debug symbols

# ✅ WASM-optimized release profile (smaller bundles)
# Use: cargo build --profile wasm-release
[profile.wasm-release]
inherits = "release"
opt-level = "z"    # Optimize for size
panic = "abort"    # Smaller panic handler

[profile.dev-fast]
inherits = "dev"
opt-level = 1
