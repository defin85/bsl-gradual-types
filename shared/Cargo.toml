[package]
name = "bsl-shared"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared types and domain logic for BSL Gradual Type System"

[lib]
name = "bsl_shared"
path = "src/lib.rs"

[dependencies]
# Core dependencies
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
chrono = { workspace = true }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
strsim = "0.11"  # MILESTONE 3.6 Phase 3: Fuzzy string matching for diagnostics hints

# Dependencies for loaders (optional for WASM)
dashmap = { workspace = true }
quick-xml = { workspace = true }
scraper = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
tracing = { workspace = true }

# Features
[features]
default = ["loaders", "scrapers"]
loaders = ["rayon", "indicatif", "walkdir"]
scrapers = ["scraper"]
wasm = []

[dev-dependencies]
tempfile = { workspace = true }
