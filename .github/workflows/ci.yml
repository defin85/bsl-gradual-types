name: CI

on:
  workflow_dispatch:

permissions: read-all

env:
  # GitHub-hosted runners have limited disk; reduce Rust build artifacts.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install tailwindcss
        run: npm install -g tailwindcss@3.4.0
      - name: Cache ~/.cargo/bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-${{ hashFiles('Cargo.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-cargo-bin-
      - name: Install trunk
        run: cargo install trunk --locked
      - name: Build frontend (target/site)
        run: (cd frontend && NO_COLOR=true trunk build --release)
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked

  vscode_artifacts_policy:
    name: VSCode artifacts policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check VSCode artifacts policy (out/, *.vsix)
        run: ./scripts/check-vscode-artifacts-policy.sh

  cargo_lockfile_policy:
    name: Cargo.lock policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cargo.lock policy
        run: ./scripts/check-cargo-lockfile-policy.sh

  crate_boundaries_policy:
    name: Crate boundaries policy (bsl-agent deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check bsl-agent does not depend on bsl-backend
        run: ./scripts/check-bsl-agent-backend-dep.sh

  doc_paths_policy:
    name: Doc paths policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation path references exist
        run: python3 scripts/check-doc-paths.py --targets scripts/doc-path-check-targets.txt

  versioned_contracts_policy:
    name: Versioned contracts policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versioned contracts structure and compatibility policy
        run: python3 scripts/check-versioned-contracts.py
