name: Repo policy

on:
  pull_request:
  push:
    branches:
      - master

permissions: read-all

jobs:
  vscode_artifacts_policy:
    name: VSCode artifacts policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check VSCode artifacts policy (out/, *.vsix)
        run: ./scripts/check-vscode-artifacts-policy.sh

  cargo_lockfile_policy:
    name: Cargo.lock policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cargo.lock policy
        run: ./scripts/check-cargo-lockfile-policy.sh

  crate_boundaries_policy:
    name: Crate boundaries policy (bsl-agent deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check bsl-agent does not depend on bsl-backend
        run: ./scripts/check-bsl-agent-backend-dep.sh
