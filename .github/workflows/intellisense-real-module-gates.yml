name: IntelliSense Real-Module Gates

on:
  workflow_dispatch:
    inputs:
      conf_big_root:
        description: Absolute path to the conf_big fixture on the self-hosted runner
        required: false
        default: /srv/bsl-fixtures/conf_big

permissions: read-all

concurrency:
  group: intellisense-real-module-gates
  cancel-in-progress: false

jobs:
  intellisense_real_module_gates:
    name: IntelliSense real-module representative gates
    runs-on: [self-hosted, linux, x64, conf-big]
    timeout-minutes: 180
    env:
      BSL_TEST_CONF_BIG_ROOT: ${{ inputs.conf_big_root }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache trunk binary
        id: cache_trunk
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/trunk
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-bin-trunk-0.21.14
      - name: Install tailwindcss
        run: npm install -g tailwindcss@3.4.0
      - name: Install trunk
        if: ${{ steps.cache_trunk.outputs.cache-hit != 'true' }}
        run: cargo install trunk --locked --version 0.21.14
      - name: Validate versioned contracts before representative gates
        run: python3 scripts/check-versioned-contracts.py
      - name: Validate self-hosted conf_big fixture
        run: |
          if [[ -z "${BSL_TEST_CONF_BIG_ROOT}" ]]; then
            echo "BSL_TEST_CONF_BIG_ROOT must not be empty."
            exit 1
          fi
          if [[ ! -f "${BSL_TEST_CONF_BIG_ROOT}/Configuration.xml" ]]; then
            echo "Missing conf_big fixture: ${BSL_TEST_CONF_BIG_ROOT}/Configuration.xml"
            exit 1
          fi
      - name: Build frontend (target/site) for representative gates
        run: (cd frontend && NO_COLOR=true trunk build --release)
      - name: Run real-module post-handoff readiness gate
        env:
          CHANGE_ID: refactor-current-revision-readiness-fast-lane
          BSL_V2_REAL_CONF_BIG_REVISION_CHURN_COMPLETION_PERF_REPORT: ${{ github.workspace }}/backend/tests/perf/reports/refactor-current-revision-readiness-fast-lane-real-conf-big-revision-churn-completion-perf-live.json
        run: cargo test -p bsl-backend --bin bsl-lsp-server p38_real_conf_big_revision_churn_completion_perf_report_live -- --nocapture
      - name: Run split-prepare warm-cache representative gate
        env:
          CHANGE_ID: refactor-completion-prepare-lightweight-exact-split
          BSL_V2_REAL_CONF_BIG_WARM_CACHE_COMPLETION_PERF_REPORT: ${{ github.workspace }}/backend/tests/perf/reports/refactor-completion-prepare-lightweight-exact-split-real-conf-big-warm-cache-completion-perf-live.json
        run: cargo test -p bsl-backend --bin bsl-lsp-server p37_real_conf_big_warm_cache_completion_perf_report_live -- --nocapture
      - name: Run split-prepare revision-churn representative gate
        env:
          CHANGE_ID: refactor-completion-prepare-lightweight-exact-split
          BSL_V2_REAL_CONF_BIG_REVISION_CHURN_COMPLETION_PERF_REPORT: ${{ github.workspace }}/backend/tests/perf/reports/refactor-completion-prepare-lightweight-exact-split-real-conf-big-revision-churn-completion-perf-live.json
        run: cargo test -p bsl-backend --bin bsl-lsp-server p38_real_conf_big_revision_churn_completion_perf_report_live -- --nocapture
      - name: Run documentSymbol mixed-load representative gate
        env:
          CHANGE_ID: refactor-document-symbol-interactive-isolation
          BSL_V2_REAL_CONF_BIG_DOCUMENT_SYMBOL_MIXED_LOAD_REPORT: ${{ github.workspace }}/backend/tests/perf/reports/refactor-document-symbol-interactive-isolation-real-conf-big-document-symbol-mixed-load-live.json
        run: cargo test -p bsl-backend --bin bsl-lsp-server p39_real_conf_big_document_symbol_mixed_load_gate_live -- --nocapture
      - name: Run pre-dispatch ingress mixed-load representative gate
        env:
          CHANGE_ID: isolate-completion-pre-dispatch-ingress
          BSL_V2_REAL_CONF_BIG_DOCUMENT_SYMBOL_MIXED_LOAD_REPORT: ${{ github.workspace }}/backend/tests/perf/reports/isolate-completion-pre-dispatch-ingress-real-conf-big-document-symbol-mixed-load-live.json
        run: cargo test -p bsl-backend --bin bsl-lsp-server p39_real_conf_big_document_symbol_mixed_load_gate_live -- --nocapture
      - name: Run overlap supersession revision-churn representative gate
        env:
          CHANGE_ID: refactor-completion-superseded-active-turn-release
          BSL_V2_REAL_CONF_BIG_REVISION_CHURN_COMPLETION_PERF_REPORT: ${{ github.workspace }}/backend/tests/perf/reports/refactor-completion-superseded-active-turn-release-real-conf-big-revision-churn-completion-perf-live.json
        run: cargo test -p bsl-backend --bin bsl-lsp-server p38_real_conf_big_revision_churn_completion_perf_report_live -- --nocapture
      - name: Run overlap supersession representative gate
        env:
          CHANGE_ID: refactor-completion-superseded-active-turn-release
          BSL_V2_REAL_CONF_BIG_OVERLAP_COMPLETION_PERF_REPORT: ${{ github.workspace }}/backend/tests/perf/reports/refactor-completion-superseded-active-turn-release-real-conf-big-overlap-completion-perf-live.json
        run: cargo test -p bsl-backend --bin bsl-lsp-server p40_real_conf_big_same_file_overlap_completion_perf_report_live -- --nocapture
      - name: Run turn-wait lifecycle revision-churn representative gate
        env:
          CHANGE_ID: refactor-completion-turn-wait-lifecycle
          BSL_V2_REAL_CONF_BIG_REVISION_CHURN_COMPLETION_PERF_REPORT: ${{ github.workspace }}/backend/tests/perf/reports/refactor-completion-turn-wait-lifecycle-real-conf-big-revision-churn-completion-perf-live.json
        run: cargo test -p bsl-backend --bin bsl-lsp-server p38_real_conf_big_revision_churn_completion_perf_report_live -- --nocapture
      - name: Run turn-wait lifecycle pre-active overlap representative gate
        env:
          CHANGE_ID: refactor-completion-turn-wait-lifecycle
          BSL_V2_REAL_CONF_BIG_PRE_ACTIVE_OVERLAP_COMPLETION_PERF_REPORT: ${{ github.workspace }}/backend/tests/perf/reports/refactor-completion-turn-wait-lifecycle-real-conf-big-pre-active-overlap-completion-perf-live.json
        run: cargo test -p bsl-backend --bin bsl-lsp-server p41_real_conf_big_pre_active_turn_wait_overlap_completion_perf_report_live -- --nocapture
      - name: Run slot-release revision-churn representative gate
        env:
          CHANGE_ID: refactor-completion-turn-wait-slot-release
          BSL_V2_REAL_CONF_BIG_REVISION_CHURN_COMPLETION_PERF_REPORT: ${{ github.workspace }}/backend/tests/perf/reports/refactor-completion-turn-wait-slot-release-real-conf-big-revision-churn-completion-perf-live.json
        run: cargo test -p bsl-backend --bin bsl-lsp-server p38_real_conf_big_revision_churn_completion_perf_report_live -- --nocapture
      - name: Run slot-release pre-active overlap representative gate
        env:
          CHANGE_ID: refactor-completion-turn-wait-slot-release
          BSL_V2_REAL_CONF_BIG_PRE_ACTIVE_OVERLAP_COMPLETION_PERF_REPORT: ${{ github.workspace }}/backend/tests/perf/reports/refactor-completion-turn-wait-slot-release-real-conf-big-pre-active-overlap-completion-perf-live.json
        run: cargo test -p bsl-backend --bin bsl-lsp-server p41_real_conf_big_pre_active_turn_wait_overlap_completion_perf_report_live -- --nocapture
      - name: Run front-edge revision-churn representative gate
        env:
          CHANGE_ID: stabilize-completion-front-edge
          BSL_V2_REAL_CONF_BIG_REVISION_CHURN_COMPLETION_PERF_REPORT: ${{ github.workspace }}/backend/tests/perf/reports/stabilize-completion-front-edge-real-conf-big-revision-churn-completion-perf-live.json
        run: cargo test -p bsl-backend --bin bsl-lsp-server p38_real_conf_big_revision_churn_completion_perf_report_live -- --nocapture
      - name: Upload representative gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intellisense-real-module-gate-reports
          path: |
            backend/tests/perf/reports/refactor-current-revision-readiness-fast-lane-*.json
            backend/tests/perf/reports/refactor-current-revision-readiness-fast-lane-*.md
            backend/tests/perf/reports/refactor-completion-prepare-lightweight-exact-split-*.json
            backend/tests/perf/reports/refactor-completion-prepare-lightweight-exact-split-*.md
            backend/tests/perf/reports/refactor-document-symbol-interactive-isolation-*.json
            backend/tests/perf/reports/refactor-document-symbol-interactive-isolation-*.md
            backend/tests/perf/reports/isolate-completion-pre-dispatch-ingress-*.json
            backend/tests/perf/reports/isolate-completion-pre-dispatch-ingress-*.md
            backend/tests/perf/reports/refactor-completion-superseded-active-turn-release-*.json
            backend/tests/perf/reports/refactor-completion-superseded-active-turn-release-*.md
            backend/tests/perf/reports/refactor-completion-turn-wait-slot-release-*.json
            backend/tests/perf/reports/refactor-completion-turn-wait-slot-release-*.md
            backend/tests/perf/reports/refactor-completion-turn-wait-lifecycle-*.json
            backend/tests/perf/reports/refactor-completion-turn-wait-lifecycle-*.md
            backend/tests/perf/reports/stabilize-completion-front-edge-*.json
            backend/tests/perf/reports/stabilize-completion-front-edge-*.md
