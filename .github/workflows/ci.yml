name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "backend/AGENTS.md"
      - "bsl-agent/AGENTS.md"
      - "bsl-agent/README.md"
      - "vscode-extension/AGENTS.md"
      - "docs/README.md"
      - "docs/BUILD_GUIDE.md"
      - "docs/agent/**"
      - "docs/guides/development-workflow.md"
      - "openspec/changes/**"
      - ".github/workflows/ci.yml"
      - ".mcp.json"
      - ".agents/skills/**"
      - "scripts/check-agent-readiness.py"
      - "scripts/check-doc-paths.py"
      - "scripts/doc-path-check-targets.txt"
      - "scripts/run-agent-readiness-checks.sh"
      - "scripts/test-agent-readiness.py"
      - "scripts/test-ci-openspec-governance-workflow.py"
      - "scripts/test-intellisense-readiness-assets.py"
      - "scripts/test-intellisense-smoke-gate.py"
      - "scripts/run-intellisense-tests.sh"
  push:
    branches:
      - master
    paths:
      - "AGENTS.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "backend/AGENTS.md"
      - "bsl-agent/AGENTS.md"
      - "bsl-agent/README.md"
      - "vscode-extension/AGENTS.md"
      - "docs/README.md"
      - "docs/BUILD_GUIDE.md"
      - "docs/agent/**"
      - "docs/guides/development-workflow.md"
      - "openspec/changes/**"
      - ".github/workflows/ci.yml"
      - ".mcp.json"
      - ".agents/skills/**"
      - "scripts/check-agent-readiness.py"
      - "scripts/check-doc-paths.py"
      - "scripts/doc-path-check-targets.txt"
      - "scripts/run-agent-readiness-checks.sh"
      - "scripts/test-agent-readiness.py"
      - "scripts/test-ci-openspec-governance-workflow.py"
      - "scripts/test-intellisense-readiness-assets.py"
      - "scripts/test-intellisense-smoke-gate.py"
      - "scripts/run-intellisense-tests.sh"

permissions: read-all

jobs:
  openspec_governance_gate:
    name: OpenSpec governance gate (default readiness path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve protected-assets base ref
        id: protected_base_ref
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref=""
          fi
          if [[ -z "${base_ref}" || "${base_ref}" == "0000000000000000000000000000000000000000" ]]; then
            base_ref="HEAD~1"
          fi
          echo "value=${base_ref}" >> "${GITHUB_OUTPUT}"
      - name: Resolve touched OpenSpec change IDs
        id: openspec_changes
        shell: bash
        run: |
          mapfile -t change_ids < <(
            git diff --name-only "${{ steps.protected_base_ref.outputs.value }}...HEAD" \
              | sed -n 's#^openspec/changes/\([^/]*\)/.*#\1#p' \
              | sort -u
          )
          if [[ ${#change_ids[@]} -eq 0 ]]; then
            echo "ids=" >> "${GITHUB_OUTPUT}"
            echo "No OpenSpec changes touched in this revision."
            exit 0
          fi
          echo "ids=${change_ids[*]}" >> "${GITHUB_OUTPUT}"
          echo "Resolved OpenSpec change IDs: ${change_ids[*]}"
      - name: Run governance gates for touched OpenSpec changes
        if: ${{ steps.openspec_changes.outputs.ids != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for change_id in ${{ steps.openspec_changes.outputs.ids }}; do
            change_root="openspec/changes/${change_id}"
            governance_root="${change_root}/governance"
            if [[ ! -f "${governance_root}/change_criticality.json" ]]; then
              echo "Skipping ${change_id}: governance artifacts are missing."
              continue
            fi
            python3 scripts/check-openspec-change-governance.py \
              --change-id "${change_id}"
            manifest="${governance_root}/protected_assets_manifest.txt"
            override="${governance_root}/protected_assets_override.json"
            if [[ -f "${manifest}" ]]; then
              python3 scripts/check-protected-assets-gate.py \
                --change-id "${change_id}" \
                --manifest "${manifest}" \
                --override "${override}" \
                --base-ref "${{ steps.protected_base_ref.outputs.value }}"
            else
              echo "Skipping protected-assets gate for ${change_id}: manifest missing."
            fi
          done

  agent_readiness_docs_gate:
    name: Agent readiness docs gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run canonical agent-readiness checks
        run: ./scripts/run-agent-readiness-checks.sh
      - name: Validate agent-readiness regression tests
        run: python3 -m unittest scripts/test-agent-readiness.py

  intellisense_smoke_gate:
    name: IntelliSense smoke gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate IntelliSense smoke contract
        run: python3 -m unittest scripts/test-intellisense-smoke-gate.py
      - name: Validate IntelliSense readiness asset sync
        run: python3 -m unittest scripts/test-intellisense-readiness-assets.py
      - name: Run IntelliSense smoke gate
        run: ./scripts/run-intellisense-tests.sh smoke

  perf_gate_architecture_policy:
    name: Perf-gate architecture policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dedicated perf-gate evaluator boundary
        run: python3 scripts/check-perf-gate-architecture.py

  intellisense_perf_gate:
    name: IntelliSense perf gate (blocking mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate versioned contracts before perf gate
        run: python3 scripts/check-versioned-contracts.py
      - name: Run IntelliSense perf gate (small|large|churn)
        env:
          BSL_V2_PERF_GATE_BLOCKING: "1"
          PERF_WARMUP: "1"
          PERF_ITERATIONS: "5"
          PERF_PROFILES: "small large churn"
          THRESHOLD_P95: "50"
          THRESHOLD_P99: "50"
          THRESHOLD_RESOURCE: "50"
        run: ./scripts/run-intellisense-perf.sh
      - name: Run real-module post-handoff readiness gate
        env:
          CHANGE_ID: refactor-current-revision-readiness-fast-lane
          BSL_V2_REAL_CONF_BIG_REVISION_CHURN_COMPLETION_PERF_REPORT: ${{ github.workspace }}/backend/tests/perf/reports/refactor-current-revision-readiness-fast-lane-real-conf-big-revision-churn-completion-perf-live.json
        run: cargo test -p bsl-backend --bin bsl-lsp-server p38_real_conf_big_revision_churn_completion_perf_report_live -- --nocapture
      - name: Run split-prepare warm-cache representative gate
        env:
          CHANGE_ID: refactor-completion-prepare-lightweight-exact-split
          BSL_V2_REAL_CONF_BIG_WARM_CACHE_COMPLETION_PERF_REPORT: ${{ github.workspace }}/backend/tests/perf/reports/refactor-completion-prepare-lightweight-exact-split-real-conf-big-warm-cache-completion-perf-live.json
        run: cargo test -p bsl-backend --bin bsl-lsp-server p37_real_conf_big_warm_cache_completion_perf_report_live -- --nocapture
      - name: Run split-prepare revision-churn representative gate
        env:
          CHANGE_ID: refactor-completion-prepare-lightweight-exact-split
          BSL_V2_REAL_CONF_BIG_REVISION_CHURN_COMPLETION_PERF_REPORT: ${{ github.workspace }}/backend/tests/perf/reports/refactor-completion-prepare-lightweight-exact-split-real-conf-big-revision-churn-completion-perf-live.json
        run: cargo test -p bsl-backend --bin bsl-lsp-server p38_real_conf_big_revision_churn_completion_perf_report_live -- --nocapture
      - name: Upload perf gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intellisense-perf-gate-reports
          path: |
            backend/tests/perf/reports/intellisense_*.json
            backend/tests/perf/reports/intellisense_*.md
            backend/tests/perf/reports/refactor-current-revision-readiness-fast-lane-*.json
            backend/tests/perf/reports/refactor-current-revision-readiness-fast-lane-*.md
            backend/tests/perf/reports/refactor-completion-prepare-lightweight-exact-split-*.json
            backend/tests/perf/reports/refactor-completion-prepare-lightweight-exact-split-*.md
